<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Crée ton réseau ! Un jeu YAP! (Your Attention Please!) sur l’économie de l’attention : une start-up crée son réseau social.">
<title>Crée ton réseau</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Parkinsans:wght@400;500;600;700&family=Righteous&family=Pacifico&family=Bungee&family=DM+Serif+Display&display=swap">
<style>
html{-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* Layout : plateau inspiré des cartes du kit YAP. Carte recto/verso au centre, marge « Le saviez-vous » à droite, frise des cartes et jauges en tête. Charte YAP, thème clair assumé. */
:root{
  --cream:#FFFDF5; --paper:#FFFFFF; --ink:#1B1D3A; --muted:#5D6079; --line:#E7E1CF; --track:#EFEADB;
  --blue:#415FFF; --rose:#C94068; --sun:#FCC83A; --sun-soft:#FFF5CF; --sun-ink:#3A2C00;
  --p1:#415FFF; --p2:#FD3A6D; --p3:#548D71; --p4:#FF751F;
  --f:"Parkinsans","Trebuchet MS",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--cream);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.5;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:1100px;margin:0 auto}
h1,h2,h3,h4{font-family:var(--f);text-wrap:balance;margin:0;line-height:1.12}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tnum{font-variant-numeric:tabular-nums}

/* Marque */
.yap{display:inline-block;flex:none}
.yap img{display:block;width:100%;height:auto}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:12px 22px;font-weight:600;background:var(--blue);color:#fff;min-height:48px}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.ghost{background:var(--paper);color:var(--ink);border:2px solid var(--line)}
.btn.rose{background:var(--rose)}
.btn.sun{background:var(--sun);color:var(--sun-ink)}
.ibtn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--paper);position:relative;flex:none}

/* Tête */
.top{background:var(--cream);padding-block:12px 10px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px;border-bottom:2px solid var(--line);z-index:5}
@media (min-width:761px){.top{position:sticky;top:env(safe-area-inset-top,0px)}}
.top-row{display:flex;align-items:center;gap:10px}
.top-row .yap{width:112px}
.namebtn{display:flex;align-items:center;gap:8px;border:0;background:none;padding:4px 0;min-width:0;flex:1;text-align:left}
.namebtn h1{font-size:clamp(1.25rem,4vw,1.7rem);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.namebtn h1.empty{color:var(--muted);font-weight:500}
.namebtn svg{color:var(--rose)}
.strip-wrap{display:flex;align-items:center;gap:10px}
.strip{display:flex;gap:4px;overflow-x:auto;padding-block:2px 4px;flex:1;min-width:0;scrollbar-width:thin}
.chipc{flex:none;width:30px;height:28px;border-radius:7px;border:2px solid var(--line);background:var(--paper);font-size:10px;font-weight:600;color:var(--muted);padding:0;display:grid;place-items:center}
.chipc.done{background:var(--pc);border-color:var(--pc);color:#fff}
.chipc.cur{border-color:var(--pc);color:var(--pc);box-shadow:0 0 0 2px color-mix(in srgb,var(--pc) 30%,transparent)}
.chipc.rev{outline:3px solid var(--sun);outline-offset:1px}
.chipc:disabled{cursor:default}
.chipc.gap{margin-left:6px}
.count{font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}

/* Jauges */
.gauges{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.g{display:flex;align-items:center;gap:8px;background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:6px 10px;min-width:0}
.g .lbl{font-size:12px;font-weight:600;white-space:nowrap}
.g .track{flex:1;height:10px;border-radius:5px;background:var(--track);overflow:hidden;min-width:24px;display:flex}
.g .track i{display:block;height:100%;background:var(--ink);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.g .track i.plus{background:repeating-linear-gradient(-45deg,var(--blue) 0 4px,#8EA0FF 4px 8px)}
.g .track i.minus{background:repeating-linear-gradient(-45deg,var(--rose) 0 4px,#E79AB0 4px 8px)}
.g .v{font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;min-width:2.2em;text-align:right;white-space:nowrap}
.g .v small{font-weight:600;font-size:12px}
.g .v .up{color:var(--blue)} .g .v .down{color:var(--rose)}
@media (max-width:760px){.gauges{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:400px){.g .lbl{display:none}}

/* Accueil */
.hero{padding-block:36px 22px;display:grid;gap:14px}
.hero .yap{width:min(280px,72vw)}
.hero h1{font-size:clamp(2.6rem,10vw,5.4rem);font-weight:700;letter-spacing:-.02em;line-height:1}
.hero h1 em{font-style:normal;color:var(--blue);position:relative;white-space:nowrap}
.hero h1 em::after{content:"";position:absolute;left:0;right:0;bottom:.04em;height:.14em;background:var(--rose);border-radius:4px;z-index:-1}
.hero p{max-width:50ch;color:var(--muted);margin:0;font-size:1.08rem}
.phase-legend{display:flex;flex-wrap:wrap;gap:6px}
.phase-legend span{background:var(--pc);color:#fff;font-size:12px;font-weight:600;padding:5px 12px;border-radius:999px;letter-spacing:.04em}
.setup{display:grid;gap:22px;max-width:740px}
.field{display:grid;gap:6px}
.field label{font-weight:600;display:flex;gap:8px;align-items:center}
.field input{width:100%;font:inherit;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--paper);color:var(--ink)}
.field input.big{font-size:1.5rem;font-weight:700}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:620px){.modes{grid-template-columns:1fr}}
.mode{border:2px solid var(--line);background:var(--paper);border-radius:var(--r);padding:16px;text-align:left;display:grid;gap:2px}
.mode[aria-pressed="true"]{border-color:var(--blue);box-shadow:0 0 0 3px #D7DEFF}
.mode .n{font-size:30px;font-weight:700;color:var(--blue);line-height:1}
.mode b{font-size:1.2rem}
.mode small{color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--muted);font-size:14px}
.legend span{display:flex;gap:6px;align-items:center}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* Plateau et carte (recto / verso comme le kit) */
.board{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:18px;padding-block:18px}
@media (max-width:880px){.board{grid-template-columns:1fr}}
.card{background:var(--paper);border-radius:22px;border:3px solid var(--pc);min-width:0;padding:20px;display:grid;gap:16px}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.cat{background:var(--pc);color:#fff;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;padding:6px 12px;border-radius:8px}
.code{font-weight:600;color:var(--pc);font-size:14px}
.phase-tag{font-size:12px;font-weight:600;color:var(--muted)}
.card h2{font-size:clamp(1.4rem,3.4vw,1.9rem);font-weight:700}
.ctx{color:var(--muted);margin:0;max-width:64ch;font-style:italic;font-size:15px}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:44px 1fr;gap:2px 14px;align-items:center;text-align:left;border:2px solid var(--line);background:var(--cream);border-radius:14px;padding:10px 14px 10px 10px;min-width:0}
.opt .num{grid-row:span 2;width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:17px;background:var(--pc);color:#fff;align-self:start}
.opt b{font-size:1.04rem;line-height:1.25}
.opt span{color:var(--muted);font-size:14px;line-height:1.35}
.opt:hover{border-color:color-mix(in srgb,var(--pc) 50%,var(--line))}
.opt[aria-checked="true"]{border-color:var(--pc);background:color-mix(in srgb,var(--pc) 9%,var(--paper))}
.opt[aria-checked="true"] .num{box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--pc)}
.verso{background:var(--pc);color:#fff;border-radius:16px;padding:16px 18px;display:grid;gap:12px}
.verso .vh{display:flex;gap:8px;align-items:center;font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:13px}
.verso p{margin:0;font-size:1.02rem;line-height:1.45}
.deltas{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px 5px 8px;border-radius:999px;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;background:var(--paper);color:var(--ink)}
.chip svg{width:16px;height:16px}
.chip.flat{opacity:.65}
.actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;align-items:center}
.hint{color:var(--muted);font-size:14px;display:flex;gap:6px;align-items:center;margin-right:auto}
.multi{display:inline-flex;align-items:center;gap:6px;justify-self:start;background:var(--sun-soft);border:2px solid var(--sun);color:var(--sun-ink);font-weight:600;font-size:14px;padding:6px 12px;border-radius:999px}
.opt.is-multi .num{border-radius:50%}
.was{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;font-weight:600}

/* Marge « Le saviez-vous » */
.margin{background:var(--sun-soft);border:2px solid var(--sun);border-radius:20px;padding:18px;align-self:start;display:grid;gap:10px}
.margin button{border:0;background:none;padding:0;display:flex;gap:8px;align-items:center;justify-content:space-between;width:100%;text-align:left}
.margin h3{font-size:1rem;display:flex;gap:8px;align-items:center;color:var(--blue);text-transform:uppercase;letter-spacing:.06em}
.margin h3 svg{color:#D49A00}
.margin p{margin:0;font-size:15px;font-style:italic;color:#24317A;line-height:1.5}
.margin.closed p{display:none}

/* Debrief, portrait */
.debrief{padding-block:22px;display:grid;gap:18px}
.dhead{display:grid;gap:6px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--pc,var(--blue))}
.dhead h2{font-size:clamp(1.9rem,5vw,2.8rem);font-weight:700}
.panel{background:var(--paper);border-radius:20px;padding:20px;border:2px solid var(--line);display:grid;gap:12px;min-width:0;align-content:start}
.panel h3{font-size:1.15rem;display:flex;gap:8px;align-items:center}
.stems{display:grid;margin:0}
.stem{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr) auto;gap:10px;align-items:center;padding-block:10px;border-top:1px solid var(--line)}
.stem:first-child{border-top:0}
.stem dt{color:var(--muted);font-size:14px}
.stem dd{margin:0;font-weight:600}
@media (max-width:620px){.stem{grid-template-columns:minmax(0,1fr) auto}.stem dt{grid-column:1/-1}}
.tension{border-left:6px solid var(--pc);background:color-mix(in srgb,var(--pc) 8%,var(--paper));border-radius:12px;padding:14px 16px;display:grid;gap:10px}
.tension.ok{opacity:.55}
.tension p{margin:0;font-weight:600;font-size:1.05rem}
.tension .row .btn{min-height:40px;padding:8px 14px;font-size:14px}
.btn.revise{background:var(--paper);color:var(--ink);border:2px solid var(--line)}
.btn.revise b{color:var(--pc)}
.calm{color:var(--muted);margin:0}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:760px){.two{grid-template-columns:1fr}}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.note{font-size:13px;color:var(--muted);margin:0}

/* Pied de page Erasmus+ */
.eu{margin-top:28px;display:flex;justify-content:flex-end}
.eu img{height:26px;width:auto;max-width:100%;flex:none;background:#1B1D3A;padding:6px 9px;border-radius:7px;box-sizing:content-box}
.eu p{margin:0;font-size:12px;line-height:1.45;flex:1;min-width:220px;opacity:.9}

/* Journal */
.drawer{position:fixed;inset:0;z-index:20;display:flex;justify-content:flex-end;background:rgba(27,29,58,.45)}
.drawer-in{background:var(--cream);width:min(460px,100%);height:100%;overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));display:grid;gap:12px;align-content:start}
.drawer-top{display:flex;justify-content:space-between;align-items:center}
.drawer-top h2{display:flex;gap:10px;align-items:center;font-size:1.4rem}
.jphase{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--pc);margin-top:6px}
details.ji{background:var(--paper);border-radius:12px;border:2px solid var(--line)}
details.ji summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
details.ji summary::-webkit-details-marker{display:none}
details.ji .lab{font-weight:600;min-width:0}
details.ji .lab small{display:block;font-weight:400;color:var(--muted);font-size:13px}
details.ji .more{padding:0 14px 14px;display:grid;gap:10px}

/* Modale */
.modal{position:fixed;inset:0;z-index:30;background:rgba(27,29,58,.5);display:grid;place-items:center;padding:16px}
.modal-in{background:var(--paper);border-radius:20px;padding:22px;width:min(460px,100%);display:grid;gap:14px}

/* Portrait */
.idrow{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;padding-block:12px;border-top:1px solid var(--line);align-items:start}
.idrow:first-child{border-top:0}
.idrow .ic{width:44px;height:44px;border-radius:12px;background:#E5EAFF;display:grid;place-items:center;color:var(--blue)}
.idrow b{display:block;font-size:1.02rem}
.idrow span{color:var(--muted);font-size:14px}
.verdict{background:var(--blue);color:#fff;border-radius:20px;padding:20px;display:grid;gap:6px}
.verdict h3{font-size:1.5rem}
.verdict p{margin:0}
.bigg .gauges{grid-template-columns:1fr}
.bigg .g .lbl{display:inline;width:6.5em}

/* Baseline */
.preview{background:var(--blue);color:#fff;border-radius:20px;padding:28px 22px;display:grid;gap:8px;text-align:center}
.preview .nm{font-weight:700;font-size:clamp(1.8rem,6vw,2.6rem);overflow-wrap:anywhere}
.preview .bl{font-size:1.1rem;min-height:1.6em}
.suggs{display:flex;flex-wrap:wrap;gap:8px}
.sugg.more{display:inline-flex;align-items:center;border-style:solid;border-color:var(--blue);color:var(--blue)}
.sugg{border:2px dashed #B9C4FF;background:var(--paper);border-radius:999px;padding:8px 14px;font-size:14px}

/* Logo */
.logo-grid{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:760px){.logo-grid{grid-template-columns:1fr}}
.stage{position:relative;width:100%;max-width:320px;aspect-ratio:1;margin:0 auto;border-radius:20px;background:conic-gradient(#F3EFE2 25%,var(--paper) 0 50%,#F3EFE2 0 75%,var(--paper) 0) 0 0/24px 24px;border:2px solid var(--line)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;max-width:100%}
#drawc{touch-action:none}
.stage.drawing{border-color:var(--blue)}
.tabs{display:flex;gap:8px}
.tab{flex:1;display:flex;gap:8px;align-items:center;justify-content:center;border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:10px;font-weight:600;min-height:48px}
.tab[aria-selected="true"]{border-color:var(--blue);background:#E5EAFF}
.ctrl{display:grid;gap:8px}
.ctrl h4{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.cbtn{width:48px;height:48px;border-radius:12px;border:2px solid var(--line);background:var(--paper);display:grid;place-items:center;padding:0}
.cbtn[aria-pressed="true"]{border-color:var(--blue);box-shadow:0 0 0 3px #D7DEFF}
.cbtn svg{width:26px;height:26px}
.sw{width:36px;height:36px;border-radius:50%;border:3px solid var(--paper);box-shadow:0 0 0 2px var(--line);padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--blue)}
.fontbtn{border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:8px 14px;font-size:20px;min-height:48px;max-width:100%;overflow:hidden}
.fontbtn[aria-pressed="true"]{border-color:var(--blue);background:#E5EAFF}
input[type=range]{width:100%;accent-color:var(--blue)}

/* Affiche */
.poster{position:relative;background:var(--paper);border-radius:28px;border:3px solid var(--ink);padding:34px 20px 28px;display:grid;justify-items:center;gap:10px;text-align:center;overflow:hidden}
.poster .bands{position:absolute;left:0;right:0;top:0;height:12px;display:flex}
.poster .bands i{flex:1}
.poster img{width:min(230px,62vw);height:auto;aspect-ratio:1}
.poster .nm{font-size:clamp(2.1rem,8vw,3.4rem);line-height:1.08;overflow-wrap:anywhere;font-weight:700}
.poster .bl{color:var(--muted);font-size:1.15rem;max-width:40ch}
.stamp{position:absolute;top:26px;right:18px;background:var(--rose);color:#fff;font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;padding:8px 14px;border-radius:999px;transform:rotate(8deg)}
.party .poster img{animation:pop .9s cubic-bezier(.2,1.5,.4,1) both}
.party .poster .nm{animation:rise .6s .35s cubic-bezier(.2,.9,.3,1) both}
.party .poster .bl{animation:rise .6s .55s cubic-bezier(.2,.9,.3,1) both}
.party .stamp{animation:stamp .5s .9s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{0%{transform:scale(.2) rotate(-25deg)}100%{transform:none}}
@keyframes rise{0%{transform:translateY(24px);opacity:0}100%{transform:none;opacity:1}}
@keyframes stamp{0%{transform:scale(2.4) rotate(-10deg);opacity:0}100%{transform:rotate(8deg);opacity:1}}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
ol.qs{margin:0;padding-left:1.3em;display:grid;gap:10px}
ol.qs li.hot{font-weight:600}
.dl{display:flex;gap:10px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:999px;font-weight:600;z-index:50;max-width:calc(100% - 32px);text-align:center}
@keyframes enter{from{transform:translateY(8px)}to{transform:none}}
.enter{animation:enter .3s ease-out}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="wrap" id="app"></div>
<footer class="wrap eu" id="eu-foot"></footer>
<div id="layer"></div>

<script>
(function(){
"use strict";
/* ---------- Icônes ---------- */
const P={
  check:'<path d="M5 12l5 5L20 7"/>',
  next:'<path d="M5 12h14M13 6l6 6-6 6"/>',
  back:'<path d="M19 12H5M11 6l-6 6 6 6"/>',
  book:'<path d="M4 19V5a2 2 0 0 1 2-2h13v14H6a2 2 0 0 0-2 2zm0 0a2 2 0 0 0 2 2h13"/>',
  pencil:'<path d="M4 20h4L19 9l-4-4L4 16zM14 6l4 4"/>',
  bolt:'<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',
  bulb:'<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.6.6 1 1.5 1 2.5h6c0-1 .4-1.9 1-2.5A6 6 0 0 0 12 3z"/>',
  undo:'<path d="M4 9h11a5 5 0 0 1 0 10H8M8 5 4 9l4 4"/>',
  x:'<path d="M6 6l12 12M18 6 6 18"/>',
  chev:'<path d="M9 6l6 6-6 6"/>',

 o:[["Les 13-18 ans","Collégien·nes et lycéen·nes intéressé·es par la musique, les jeux vidéo, les tendances et les créateur·rices.","Votre public peut participer très activement, mais vous devez prévoir des protections renforcées pour les mineur·es.",[2,0,-1,-1]],
 ["Les 25-40 ans actifs","Professionnel·les, parents, personnes qui suivent l’actu ou recherchent des contenus pratiques.","Ce public dispose souvent de davantage de moyens financiers, mais de moins de temps libre.",[0,2,0,0]],
 ["Un public « universel »","Tout le monde, sans ciblage particulier.","Votre marché potentiel est important, mais il sera difficile de vous différencier des grandes plateformes existantes.",[1,-1,0,0]],
 ["Une communauté de niche","Passionné·es d’une thématique (écologie, art, sport, cuisine, mangas, jeux, séries...).","Votre public sera plus restreint, mais ses membres pourront être très engagé·es et plus disposé·es à soutenir financièrement la plateforme.",[-1,1,0,1]]],
 sv:"TikTok a d’abord ciblé les 13-25 ans avec des contenus musicaux. Ce choix a directement façonné son design : vidéos courtes, son central, interface de création accessible sans compétences techniques. L’algorithme de découverte a été conçu pour surprendre, ce qui favorise la viralité et maintient l’engagement. Le modèle a depuis débordé cette cible initiale, mais la logique reste la même : capter par la nouveauté, retenir par la personnalisation, monétiser via la publicité ciblée et les partenariats créateurs."},
A2:{q:"Quel est le but principal de votre plateforme ?",ctx:"La mission correspond à ce que votre plateforme promet d’apporter aux utilisateur·rices. Elle doit guider vos décisions. Mais elle peut aussi entrer en contradiction avec votre manière de gagner de l’argent.",stem:"Sa mission principale est de",
 o:[["Divertir","Proposer des contenus amusants, légers et agréables à regarder.","Les contenus amusants peuvent attirer beaucoup de monde, mais la recherche de réactions rapides peut favoriser les contenus excessifs ou choquants.",[2,1,0,-1]],
 ["Connecter","Aider les personnes à créer des liens ou à rester en contact avec leurs proches.","Votre plateforme peut renforcer les relations sociales, mais elle devra protéger les échanges privés et limiter le harcèlement.",[1,0,-1,1]],
 ["Informer","Faciliter l’accès à des informations fiables, utiles et variées.","Vous devrez privilégier la qualité et la fiabilité, même lorsque les contenus sérieux attirent moins de réactions.",[-1,-1,0,2]],
 ["Créer et partager","Donner aux utilisateur·rices des outils pour produire et publier leurs propres contenus.","Votre plateforme peut encourager la créativité, mais elle devra aider les créateur·rices et gérer une grande quantité de contenus.",[1,-1,0,1]]],
 sv:"De nombreuses plateformes ont commencé avec une mission sociale ou créative avant que leurs objectifs économiques ne prennent davantage de place. Instagram en est un exemple : lancé pour « capturer et partager les moments du quotidien », la plateforme a progressivement privilégié la publicité ciblée et l’engagement au détriment de sa mission initiale, au point que des documents internes révélés en 2021 ont montré que Meta connaissait les effets négatifs d’Instagram sur l’image corporelle des adolescentes, sans modifier ses choix de design."},
A3:{q:"Où lancez-vous votre plateforme ?",ctx:"Le territoire de lancement influence les langues utilisées, les règles juridiques à respecter, les moyens techniques nécessaires et la concurrence.",stem:"Nous lançons notre plateforme",
 o:[["À l’échelle locale","Votre ville, votre région ou une petite communauté géographique.","Il sera plus facile de comprendre votre public et de créer une communauté proche, mais votre nombre d’utilisateur·rices sera limité.",[-2,-1,1,1]],
 ["Dans un seul pays","Vous commencez sur un marché national avant de vous développer ailleurs.","Vous pourrez adapter plus facilement votre plateforme à une langue et à une réglementation, mais votre croissance sera plus lente.",[-1,0,1,0]],
 ["Dans plusieurs pays européens","Un public plus large, avec plusieurs langues et cultures.","Votre marché sera plus large, mais vous devrez respecter plusieurs langues, cultures et règles européennes concernant les données et les services numériques.",[1,0,1,0]],
 ["À l’échelle internationale","Votre plateforme est disponible rapidement dans de nombreux pays.","Votre potentiel de croissance sera très important, mais vous devrez gérer des lois, des langues et des usages très différents.",[2,1,-1,-1]]],
 sv:"Dans l’Union européenne, le RGPD et le Digital Services Act imposent des règles strictes aux grandes plateformes, qui doivent souvent adapter leurs pratiques selon les pays. TikTok en est un exemple concret : sous pression des autorités européennes, la plateforme a dû revoir ses pratiques de collecte de données et renforcer sa modération, alors que ces mêmes règles n’existent pas dans d’autres marchés."},
A4:{q:"Comment saurez-vous que votre plateforme fonctionne bien ?",ctx:"Ce que vous mesurez influence ce que vous cherchez à améliorer. Une plateforme qui mesure surtout le temps passé ne prendra pas les mêmes décisions qu’une plateforme qui mesure le bien-être ou la qualité des échanges.",stem:"Nous mesurons notre succès avec",
 o:[["Le temps passé","Vous mesurez la durée des visites et le nombre de contenus regardés.","Cet indicateur est facile à mesurer et intéressant pour la publicité, mais il peut pousser à retenir les personnes le plus longtemps possible.",[1,2,-1,-2]],
 ["Les utilisateur·rices actif·ves","Vous mesurez combien de personnes utilisent régulièrement la plateforme.","Cet indicateur montre si votre plateforme se développe, mais il ne dit pas si l’expérience proposée est de bonne qualité.",[2,1,0,0]],
 ["La qualité des interactions","Vous mesurez les conversations utiles, les échanges respectueux et les liens créés.","Vous encouragez des échanges plus riches, mais leur qualité est difficile à mesurer automatiquement.",[0,-1,0,2]],
 ["L’impact positif déclaré","Vous demandez aux utilisateur·rices si la plateforme améliore leur satisfaction, leur apprentissage ou leur bien-être.","Vous placez le bien-être au centre de vos décisions, mais les réponses peuvent être subjectives et difficiles à comparer.",[-1,-1,0,2]]],
 sv:"Les plateformes utilisent de nombreux indicateurs pour mesurer l’engagement, mais optimiser l’un d’eux peut produire des effets inattendus. YouTube en est un exemple : lorsque la plateforme a basculé en 2012 de la mesure des clics vers le temps de visionnage comme indicateur principal, elle cherchait à valoriser des contenus de qualité. Son algorithme a alors commencé à favoriser les vidéos longues et à recommander des contenus de plus en plus clivants pour maintenir les utilisateurs connectés, contribuant sans l’avoir prévu à la diffusion massive de désinformation et de contenus extrêmes."},
B1:{q:"Quel type de réseau social créez-vous ?",ctx:"Le type de réseau détermine qui communique avec qui et comment les contenus circulent. Il influence la visibilité, les relations sociales et la manière dont les utilisateur·rices découvrent de nouveaux contenus.",stem:"Notre réseau est",
 o:[["Un réseau de découverte","On voit surtout des contenus de personnes qu’on ne suit pas encore.","Les contenus peuvent devenir rapidement visibles, mais les liens personnels risquent de passer au second plan.",[2,1,-1,-1]],
 ["Un réseau de liens proches","On partage surtout avec ses ami·es, sa famille ou ses contacts réels.","Les échanges peuvent être plus personnels et plus utiles, mais les contenus circuleront moins largement.",[-1,0,0,1]],
 ["Un réseau professionnel","Les échanges portent sur le travail, les compétences, les études et les projets.","Votre plateforme peut proposer des services payants et utiles, mais les échanges risquent de devenir très compétitifs ou trop centrés sur l’image professionnelle.",[0,2,0,-1]],
 ["Un réseau thématique","On se réunit autour de passions, de sujets ou de communautés.","Les communautés peuvent être très engagées, mais certaines risquent de s’isoler ou de devenir difficiles à modérer.",[0,0,0,1]]],
 sv:"Sur TikTok, personne n’a besoin de suivre des comptes pour tomber sur une vidéo virale : le fil « Pour toi » propose d’emblée des contenus de parfaits inconnus, sélectionnés uniquement selon ce qu’on a regardé, liké ou commenté. C’est comme ça qu’un son devient viral en 48h ou qu’un créateur inconnu se retrouve à 2 millions de vues du jour au lendemain. Sur Instagram ou Snapchat, l’expérience reste ancrée dans le réseau réel : on voit d’abord ce que ses amis publient, ce qui crée une dynamique sociale très différente."},
B2:{q:"Quelle promesse faites-vous aux utilisateur·rices ?",ctx:"La promesse est le message principal présenté aux personnes qui découvrent votre plateforme. Elle doit être claire, attractive et cohérente avec vos décisions réelles.",stem:"Notre promesse",
 o:[["« Ton espace, tes règles »","Respect de la vie privée, peu ou pas de publicité, davantage de contrôle.","Cette promesse peut créer de la confiance, mais elle limite certaines formes de publicité et de personnalisation.",[-1,-2,2,1]],
 ["« Rejoins ta communauté »","Favoriser l’appartenance, les échanges et les relations sociales.","Vous devrez créer des outils qui favorisent les liens, tout en protégeant les membres contre l’exclusion et le harcèlement.",[1,0,0,1]],
 ["« Exprime-toi librement »","Permettre à chacun·e de s’exprimer avec le moins de restrictions possible.","Vous attirerez des personnes qui souhaitent s’exprimer librement, mais vous devrez définir des limites face aux contenus haineux, dangereux ou illégaux.",[1,0,0,-2]],
 ["« Découvre de nouveaux contenus »","Surprendre grâce à des recommandations personnalisées.","Votre plateforme pourra proposer une expérience très attractive, mais elle devra collecter des informations sur les préférences et les comportements.",[2,1,-2,0]]],
 sv:"Une promesse crée des attentes. Si une plateforme promet de protéger la vie privée, mais utilise ensuite les données pour de la publicité ciblée, elle risque de perdre la confiance de son public. La promesse ne doit donc pas être seulement un slogan : elle doit guider les choix de la plateforme."},
B3:{q:"Quel format sera au centre de votre plateforme ?",ctx:"Le format influence la manière dont les personnes consomment, créent et partagent les contenus. Il détermine également le type d’attention demandé aux utilisateur·rices.",stem:"Le format principal",
 o:[["Vidéos courtes","Moins de 90 secondes, faciles à regarder et à partager.","Elles attirent rapidement l’attention et circulent facilement, mais elles peuvent encourager un rythme rapide et une consommation continue.",[2,1,0,-2]],
 ["Textes et images","Texte, photographies, illustrations ou liens.","Ils permettent davantage de détails et de réflexion, mais demandent parfois plus d’effort pour lire ou créer.",[0,0,0,1]],
 ["Audio et podcasts","Des contenus sonores à écouter en déplacement ou pendant une autre activité.","Ils favorisent une écoute plus longue et fidèle, mais ils sont plus difficiles à parcourir rapidement et à modérer.",[-1,0,0,1]],
 ["Contenus éphémères","Des publications qui disparaissent après une durée limitée, par exemple 24 heures.","Ils encouragent la spontanéité, mais peuvent aussi créer une peur de manquer quelque chose.",[1,0,1,-1]]],
 sv:"Les vidéos courtes sont devenues très présentes sur les smartphones. Leur format vertical et leur durée réduite permettent de passer rapidement d’un contenu à un autre. À l’inverse, les contenus longs demandent souvent une attention plus soutenue."},
B4:{q:"Comment allez-vous attirer vos premiers utilisateur·rices ?",ctx:"Une plateforme a besoin d’une première communauté pour fonctionner. La manière dont vous attirez vos premiers membres influencera la culture et l’image de votre réseau.",stem:"Nos premiers membres arrivent grâce à",
 o:[["Accès sur invitation","Seules les personnes invitées peuvent rejoindre la plateforme au début.","Vous créez un sentiment d’exclusivité et une communauté initiale choisie, mais votre croissance sera lente.",[-2,0,0,1]],
 ["Parrainage entre proches","Les utilisateur·rices sont encouragé·es à inviter leurs contacts.","Votre plateforme peut grandir rapidement grâce aux réseaux existants, mais certaines personnes peuvent se sentir obligées d’inviter leurs contacts.",[2,0,-1,-1]],
 ["Partenariats avec des créateur·rices","Des personnes connues ou influentes présentent votre plateforme à leur communauté.","Vous gagnez rapidement en visibilité, mais vous devenez dépendant·es de leur image et de leurs demandes.",[2,-1,0,0]],
 ["Ouverture à tout le monde","Gratuite, accessible immédiatement, avec une grande campagne de communication.","Vous pouvez attirer beaucoup de personnes, mais votre communauté sera plus difficile à organiser et à modérer.",[2,-1,0,-1]]],
 sv:"Certaines plateformes ont commencé avec un accès sur invitation afin de créer de la curiosité et un sentiment d’exclusivité. Lorsque l’accès devient ouvert à tout le monde, la plateforme peut grandir plus vite, mais perdre une partie de sa culture initiale."},
C1:{q:"Comment votre plateforme est-elle financée ?",ctx:"Faire fonctionner une plateforme coûte de l’argent : serveurs, développement, sécurité, modération. Votre source de financement détermine en grande partie à qui votre plateforme devra rendre des comptes.",stem:"Notre plateforme est financée par",
 o:[["Publicité ciblée","Gratuit pour les utilisateur·rices. Les annonceurs paient pour des publicités adaptées aux profils.","La pub ciblée aligne votre intérêt sur celui des annonceurs : retenir l’attention le plus longtemps possible.",[1,2,-2,-1]],
 ["Abonnement payant","Accès premium, sans publicité.","L’abonnement aligne votre intérêt sur celui des utilisateur·rices : les satisfaire assez pour qu’ils paient, mais certaines personnes n’auront pas les moyens de payer.",[-2,1,1,1]],
 ["Freemium","Gratuit avec pub, et une version payante sans pub.","Vous attirez un large public tout en proposant une offre payante, mais vous créez deux expériences différentes selon les moyens financiers des utilisateur·rices.",[1,1,-1,0]],
 ["Coopérative ou dons","Financée par sa communauté : dons, cotisations, contributions collectives.","Le modèle coopératif est rare mais produit des plateformes très différentes (ex : Mastodon, Wikipédia). La communauté peut participer aux décisions, mais les revenus sont souvent moins réguliers et plus difficiles à prévoir.",[-1,-2,1,2]]],
 sv:"En moyenne, un·e utilisateur·rice de Facebook vaut environ 10 à 15 € de revenus publicitaires par an pour Meta en Europe, soit 10 à 15 millions € pour un réseau d’un million d’utilisateur·rices actif·ves. Mais l’efficacité de ce modèle est de plus en plus débattue : en 2017, Procter & Gamble a retiré 200 millions de dollars de publicité ciblée sans constater de baisse de ses ventes, et le taux de clic moyen sur une publicité en ligne tourne autour de 0,01 %."},
C2:{q:"Combien coûte l’accès à votre plateforme ?",ctx:"Votre source de financement ne détermine pas forcément toutes vos conditions d’accès. Une plateforme financée par des dons peut rester gratuite. Une plateforme freemium peut proposer une partie gratuite et plusieurs fonctions payantes.",stem:"L’accès à notre plateforme est",
 o:[["Gratuit et sans publicité","Tout le monde y accède gratuitement, sans voir de publicité.","Votre plateforme est accessible et peu intrusive, mais vous devez trouver une autre source de financement suffisamment stable.",[2,-2,1,1]],
 ["Gratuit, pubs non personnalisées","Les mêmes publicités sont montrées à de grands groupes, sans profil détaillé.","Vous protégez davantage la vie privée, mais ces publicités sont moins précises et peuvent rapporter moins d’argent.",[1,0,1,0]],
 ["Gratuit, pubs personnalisées","Les publicités sont adaptées aux données, aux centres d’intérêt ou aux comportements.","Vous pouvez proposer des publicités plus rentables, mais vous devez collecter et analyser davantage de données.",[1,2,-2,0]],
 ["Payant dès l’inscription","Chaque personne doit souscrire un abonnement.","Vos revenus sont plus prévisibles et vous dépendez moins de la publicité, mais vous excluez les personnes qui ne souhaitent pas ou ne peuvent pas payer.",[-2,1,1,0]]],
 sv:"Certaines plateformes fonctionnent sans publicité, grâce aux dons et au travail bénévole. Wikipédia en est l’exemple le plus connu : l’encyclopédie est maintenue par des contributeurs volontaires et financée par les dons de ses lecteurs. Ces modèles sont possibles, mais ils dépendent d’une communauté prête à s’impliquer pour exister."},
C3:{q:"Qui paie réellement votre plateforme ?",ctx:"La personne qui utilise un service n’est pas toujours celle qui le finance. Identifier vos principaux clients permet de comprendre quels intérêts influenceront le plus vos décisions.",stem:"Ceux qui nous paient",
 o:[["Les utilisateur·rices","Abonnement, fonctions supplémentaires ou achats intégrés.","Vous devez proposer un service jugé assez utile pour payer, mais vos intérêts sont davantage liés à leur satisfaction.",[-1,1,0,1]],
 ["Les annonceurs","Les marques paient pour présenter leurs publicités aux publics présents.","Vous pouvez conserver un accès gratuit, mais vous risquez de privilégier le temps passé et la quantité d’attention disponible.",[1,2,-1,-1]],
 ["Les créateur·rices de contenu","Commission, abonnement pro ou partie de leurs revenus.","Vous devez leur fournir des outils utiles et une audience importante, mais les frais peuvent décourager les plus petits comptes.",[-1,1,0,0]],
 ["Les entreprises et organisations","Recrutement, communication, statistiques ou outils de gestion.","Vous pouvez obtenir des revenus importants, mais les besoins des entreprises risquent de prendre le dessus sur ceux du grand public.",[0,2,-1,-1]]],
 sv:"Dans un modèle publicitaire, les utilisateur·rices utilisent le service gratuitement, mais ce sont les annonceurs qui paient. Google en est l’exemple le plus parlant : le moteur de recherche est gratuit pour les internautes, mais chaque recherche génère des espaces publicitaires que Google vend aux marques. L’attention des utilisateur·rices devient alors une ressource que la plateforme cherche à attirer, mesurer et monnayer."},
C4:{q:"Comment les créateur·rices gagnent-ils de l’argent ?",ctx:"Les contenus publiés donnent de la valeur à votre plateforme. La manière dont vous rémunérez les créateur·rices influencera ce qu’ils et elles produisent, la fréquence de publication et les sujets mis en avant.",stem:"Les créateur·rices sont rémunéré·es par",
 o:[["Partage des revenus pub","Une partie des revenus publicitaires est reversée selon les vues ou le temps de visionnage.","Les créateur·rices peuvent gagner de l’argent grâce à leur audience, mais ils et elles sont incité·es à rechercher un maximum de vues.",[1,1,0,-1]],
 ["Abonnements et soutien direct","Les membres paient pour suivre un compte, accéder à des contenus exclusifs ou soutenir.","Les créateur·rices peuvent construire une communauté fidèle, mais une partie des contenus risque de devenir réservée aux personnes qui paient.",[0,1,0,1]],
 ["Partenariats avec des marques","Les créateur·rices trouvent leurs propres sponsors.","Les créateur·rices peuvent négocier leurs propres revenus, mais les contenus commerciaux ne sont pas toujours faciles à distinguer des contenus ordinaires.",[1,0,0,-1]],
 ["Aucune rémunération","On publie pour partager, participer à une communauté ou gagner en visibilité.","La plateforme reste simple et non commerciale, mais elle profite du travail des créateur·rices sans les rémunérer.",[-1,1,0,0]]],
 sv:"Les créateur·rices combinent souvent plusieurs sources de revenus : publicité, abonnements, dons, partenariats, ventes de produits ou prestations. La plus importante reste les partenariats avec les marques : selon l’étude Reech 2024, ils représentent en moyenne 62 % de leurs revenus. Une forte visibilité ne garantit pas pour autant un revenu régulier."},
D1:{q:"Jusqu’où allez-vous dans la collecte des données ?",ctx:"Les données peuvent servir à faire fonctionner le service, à améliorer les recommandations, à protéger les comptes ou à personnaliser les publicités. Mais plus une plateforme collecte de données, plus elle doit les protéger et expliquer leur utilisation.",stem:"Nous collectons",
 o:[["Données minimales","Pseudonyme, adresse électronique et âge approximatif.","Vous protégez davantage la vie privée et réduisez les risques de sécurité, mais vos recommandations et votre ciblage seront moins précis.",[-1,-1,2,1]],
 ["Données d’utilisation","Contenus regardés, clics, recherches et temps passé.","Vous comprenez mieux ce qui retient l’attention, mais vous surveillez des comportements que les personnes n’ont pas toujours conscience de révéler.",[1,1,-1,0]],
 ["Données sociales","Contacts, abonnements, conversations et interactions.","Vous pouvez mieux comprendre les groupes et les relations, mais ces informations peuvent révéler des éléments sensibles sur la vie privée.",[1,1,-2,-1]],
 ["Données contextuelles","Localisation, type d’appareil, horaires de connexion, contexte d’utilisation.","Vous personnalisez très précisément l’expérience, mais vous augmentez fortement les risques d’intrusion, de perte de confiance ou de fuite de données.",[1,2,-2,-1]]],
 sv:"Une plateforme n’apprend pas seulement grâce aux informations saisies dans un profil. Elle peut aussi déduire des préférences à partir des recherches, du temps passé, des pauses, des abonnements, des interactions et des contenus ignorés."},
D2:{q:"Que faites-vous des données collectées ?",ctx:"Collecter une donnée et l’utiliser sont deux décisions différentes. Les mêmes informations peuvent servir à sécuriser un compte, personnaliser une expérience, sélectionner une publicité ou produire des statistiques.",stem:"Ces données servent à",
 o:[["Faire fonctionner le service","Gérer les comptes, empêcher les fraudes, corriger les problèmes techniques.","Vous limitez les usages intrusifs et renforcez la confiance, mais vous renoncez à certaines formes de personnalisation et de revenus publicitaires.",[0,-1,2,1]],
 ["Personnaliser l’expérience","Recommander des contenus et adapter l’application à chaque personne.","Les contenus peuvent paraître plus pertinents, mais les utilisateur·rices risquent d’être enfermés dans des recommandations similaires.",[1,0,-1,-1]],
 ["Personnaliser les publicités","Choisir les publicités montrées à chaque profil, sans transmettre les données aux annonceurs.","Votre modèle publicitaire devient plus rentable, mais les personnes peuvent avoir le sentiment d’être observées ou manipulées.",[0,2,-1,-1]],
 ["Partager avec des partenaires","Certaines données sont communiquées à des entreprises, des chercheur·euses ou d’autres services.","Vous pouvez développer de nouveaux services ou revenus, mais vous perdez une partie du contrôle sur la circulation des données.",[0,2,-2,-1]]],
 sv:"Le scandale Cambridge Analytica a montré que des données obtenues par l’intermédiaire d’une application pouvaient circuler bien au-delà du service d’origine. Lorsqu’une plateforme partage des informations avec un partenaire, il devient plus difficile de contrôler tous leurs usages futurs."},
D3:{q:"Comment informez-vous les utilisateur·rices ?",ctx:"La transparence consiste à expliquer clairement quelles données sont collectées, pourquoi, et comment les personnes peuvent exercer leurs choix. Elle peut renforcer la confiance, mais elle demande des outils simples et compréhensibles.",stem:"Pour contrôler leurs données, on a",
 o:[["Informations légales minimales","De longs documents, des paramètres peu visibles.","Cette solution demande peu de travail, mais les utilisateur·rices risquent d’accepter des règles qu’ils et elles ne comprennent pas.",[0,1,-2,-1]],
 ["Centre de confidentialité","Une page simple résume les données collectées et permet de modifier les autorisations.","Vous facilitez les choix et renforcez la confiance, mais davantage de personnes peuvent refuser la collecte ou la publicité personnalisée.",[0,-1,1,1]],
 ["Tableau de bord personnel","Chaque personne voit les informations enregistrées à son sujet et leur utilisation.","Vous donnez un contrôle concret, mais le développement et la mise à jour de cet outil demandent du temps et des moyens.",[0,-2,2,1]],
 ["Audit indépendant","Des chercheur·euses ou organismes extérieurs vérifient vos pratiques et publient leurs conclusions.","Vous augmentez la crédibilité de la plateforme, mais vous acceptez que vos erreurs ou vos pratiques problématiques soient rendues publiques.",[1,-1,2,0]]],
 sv:"Les règles de protection des données encouragent le principe de protection dès la conception. Cela signifie que la vie privée doit être prise en compte dès le début du projet, plutôt que d’être ajoutée après la création de la plateforme."},
D4:{q:"Que se passe-t-il lorsqu’une personne veut partir ?",ctx:"Quitter une plateforme peut signifier désactiver son compte, récupérer ses contenus ou supprimer ses données. La facilité du départ révèle le niveau de contrôle réellement donné aux utilisateur·rices.",stem:"Pour partir",
 o:[["Suppression simple et rapide","Un bouton visible supprime le compte et les données.","Vous respectez l’autonomie des personnes et renforcez la confiance, mais les départs deviennent plus faciles et définitifs.",[-1,0,2,2]],
 ["Suppression après un délai","Compte désactivé, données supprimées après un délai annoncé.","Vous permettez de récupérer un compte supprimé par erreur, mais certaines données restent conservées plus longtemps.",[0,0,1,1]],
 ["Export avant suppression","On peut télécharger ses publications, contacts et informations.","Vous permettez aux personnes de conserver leurs contenus et de rejoindre un autre service, mais cette fonction est complexe et coûteuse à développer.",[0,-1,2,2]],
 ["Départ difficile","Plusieurs étapes, confirmations répétées ou contact avec l’assistance.","Vous réduisez peut-être les départs à court terme, mais vous utilisez une pratique manipulatrice qui dégrade fortement la confiance et peut poser des problèmes juridiques.",[1,1,-2,-2]]],
 sv:"Les pratiques qui rendent volontairement une action difficile sont souvent appelées des interfaces trompeuses ou des dark patterns. Elles peuvent prendre la forme de boutons cachés, de formulations culpabilisantes ou de procédures beaucoup plus longues pour refuser que pour accepter."},
E1:{q:"Comment navigue-t-on dans le fil de contenu ?",ctx:"Le mode de navigation conditionne directement le temps passé et la façon dont on vit l’application. C’est un des choix de design les plus lourds de conséquences.",stem:"Notre navigation",
 o:[["Scroll infini","Le contenu se charge automatiquement, sans fin visible.","Le scroll infini supprime les moments naturels de pause et de décision. Il augmente fortement le temps passé, mais réduit le sentiment de contrôle.",[2,2,0,-2]],
 ["Pagination","Les contenus sont organisés par pages : on clique pour voir la suite.","La pagination introduit une friction utile : un moment pour décider de continuer ou non.",[-1,-1,0,1]],
 ["Fil chronologique limité","On voit les derniers posts, dans l’ordre, puis c’est fini.","Le fil limité valorise la rareté, mais peut frustrer.",[-1,-1,0,2]],
 ["Exploration active","Pas de fil : on cherche ce qu’on veut voir.","L’exploration active donne du contrôle, mais demande plus d’effort à l’utilisateur·rice.",[-2,-1,0,2]]],
 sv:"Aza Raskin, l’inventeur du scroll infini (2006), estime aujourd’hui que son invention génère 200 000 heures de visionnage « inutile » par jour dans le monde. Il travaille sur des alternatives qui réintroduisent des pauses délibérées. Des études montrent que désactiver le scroll infini réduit le temps passé de 20 à 30 %."},
E2:{q:"Comment les contenus vidéo se lancent-ils ?",ctx:"La lecture automatique peut simplifier l’expérience, mais elle peut aussi transformer une décision active en consommation continue.",stem:"Les vidéos se lancent",
 o:[["Automatique par défaut","La vidéo suivante se lance toute seule, sauf si on désactive.","Vous augmentez la fluidité et le temps de visionnage, mais certaines personnes continueront à regarder sans l’avoir réellement décidé.",[1,2,0,-2]],
 ["À activer volontairement","Désactivée au départ, chacun·e peut l’activer.","Vous respectez davantage le choix des utilisateur·rices, mais les sessions risquent d’être plus courtes.",[-1,-1,0,1]],
 ["Avec pause de confirmation","Un court compte à rebours, on peut arrêter facilement.","Vous conservez une expérience fluide tout en laissant un moment pour s’arrêter, mais cette pause peut être ignorée par habitude.",[0,0,0,1]],
 ["Lecture manuelle","Chaque vidéo nécessite une action volontaire.","Chaque visionnage correspond à une décision consciente, mais l’expérience demande davantage d’actions.",[-1,-1,0,2]]],
 sv:"Certaines plateformes proposent un compte à rebours avant de lancer automatiquement le contenu suivant. Même une courte pause peut aider les utilisateur·rices à prendre conscience du temps passé et à décider s’ils ou elles souhaitent continuer."},
E3:{q:"Quelles notifications envoyez-vous ?",ctx:"Les notifications rappellent l’existence de la plateforme, même lorsqu’elle est fermée. Utiles pour un message important, elles deviennent intrusives quand elles sont trop nombreuses.",stem:"Nos notifications",
 o:[["Essentielles uniquement","Messages directs, alertes de sécurité, mentions importantes.","Les alertes restent utiles et peu intrusives, mais votre plateforme dispose de moins d’occasions de faire revenir les personnes.",[-1,0,0,2]],
 ["Entièrement personnalisables","Chacun·e choisit les événements qui déclenchent une alerte.","Les utilisateur·rices gardent le contrôle, mais les réglages doivent être simples et faciles à comprendre.",[0,0,0,1]],
 ["Nombreuses, activées par défaut","Likes, commentaires, nouveautés, tendances, recommandations.","Vous augmentez probablement les ouvertures de l’application, mais vous risquez de créer de l’irritation, du stress ou une sensation d’interruption permanente.",[2,1,0,-2]],
 ["Aucune notification push","On vient quand on le souhaite.","Vous respectez pleinement la tranquillité et la liberté de déconnexion, mais certaines personnes oublieront plus facilement la plateforme.",[-2,-1,0,2]]],
 sv:"Les applications doivent demander une autorisation avant d’envoyer des notifications, mais la formulation de cette demande oriente fortement la réponse. « Autoriser pour ne rien manquer » obtient beaucoup plus d’acceptations qu’une formulation neutre. C’est ce qu’on appelle un dark pattern : une interface conçue pour orienter le choix dans le sens qui arrange la plateforme."},
E4:{q:"Quels mécanismes de récompense intégrez-vous ?",ctx:"Points, badges, niveaux, séries ou classements peuvent encourager la participation, mais aussi créer de la comparaison et de la pression.",stem:"Nos récompenses",
 o:[["Aucun mécanisme","Pas de points, séries, badges ni classements.","L’expérience peut être plus calme et moins compétitive, mais la participation régulière sera plus difficile à encourager.",[-1,0,0,1]],
 ["Indicateurs privés","Chacun·e voit ses propres statistiques, sans comparaison publique.","On suit sa progression sans le regard des autres, mais on peut malgré tout chercher à augmenter ses chiffres.",[0,0,0,0]],
 ["Badges, niveaux et séries","Des récompenses quand on revient ou participe régulièrement.","Les récompenses peuvent aider à créer une habitude, mais elles risquent aussi de provoquer de la culpabilité lorsqu’une série est interrompue.",[2,1,0,-1]],
 ["Compteurs publics et classements","Likes, vues, abonnés, scores visibles par tout le monde.","Vous stimulez la compétition et la visibilité, mais vous augmentez la comparaison sociale et la pression à publier.",[2,1,-1,-2]]],
 sv:"Certaines plateformes permettent désormais de cacher les compteurs de likes ou de vues. Cette possibilité peut réduire la pression sociale, même si les chiffres restent souvent accessibles à la personne qui publie."},
F1:{q:"Qui décide de ce qui apparaît en premier ?",ctx:"L’ordre des contenus influence fortement ce que les personnes regardent, lisent et partagent. Même invisible, ce classement est un choix éditorial.",stem:"Le contenu est classé selon",
 o:[["Ordre chronologique","Les plus récents d’abord, sans personnalisation.","Le fonctionnement est simple et compréhensible, mais les contenus publiés au mauvais moment risquent d’être peu visibles.",[-1,0,1,1]],
 ["Les réactions du public","Les contenus les plus likés, commentés, partagés sont plus visibles.","Les contenus populaires circulent rapidement, mais les publications choquantes ou polarisantes peuvent être favorisées parce qu’elles génèrent beaucoup de réactions.",[2,1,0,-2]],
 ["Un classement personnalisé","Chacun·e voit d’abord ce qui correspond à son historique.","L’expérience paraît plus adaptée, mais elle peut limiter la diversité des contenus rencontrés.",[1,2,-2,-1]],
 ["Une sélection humaine","Une équipe choisit les contenus jugés importants ou de qualité.","Vous pouvez mettre en avant des contenus de qualité, mais ce travail demande du temps et repose sur des choix subjectifs.",[-1,-1,1,1]]],
 sv:"Un fil personnalisé ne montre pas simplement « ce qui existe ». Il sélectionne et classe les contenus selon des critères décidés par la plateforme. Modifier ces critères peut changer fortement ce que les utilisateur·rices voient."},
F2:{q:"Comment votre algorithme comprend-il les préférences ?",ctx:"Un algorithme de recommandation observe différents signaux. Certains sont des actions volontaires, d’autres sont déduits automatiquement des comportements.",stem:"L’algorithme apprend grâce",
 o:[["Aux actions volontaires","Abonnements, likes, partages, commentaires, signalements.","Les signaux sont plus faciles à comprendre et à contrôler, mais les recommandations seront moins précises si les personnes interagissent peu.",[-1,0,1,1]],
 ["Aux comportements observés","Temps de visionnage, arrêts, relectures, clics, vitesse de défilement.","Vous détectez très précisément ce qui retient l’attention, mais vous pouvez confondre curiosité, malaise et intérêt réel.",[1,1,-1,-1]],
 ["Aux personnes similaires","Ce qui intéresse des utilisateur·rices aux comportements proches.","Vous faites découvrir des contenus appréciés par des groupes proches, mais vous risquez de renforcer les comportements dominants du groupe.",[1,1,-1,0]],
 ["Au contexte","L’heure, le lieu, le type d’appareil ou la situation supposée.","La personnalisation devient très précise, mais la collecte est plus intrusive et peut révéler des habitudes privées.",[1,2,-2,-1]]],
 sv:"Regarder une vidéo jusqu’à la fin peut être interprété comme un signe d’intérêt, même si la personne ne clique pas sur « J’aime ». Pourtant, un temps de visionnage élevé peut aussi venir de la surprise, du choc ou de l’incompréhension."},
F3:{q:"Qu’est-ce que votre algorithme cherche à améliorer ?",ctx:"Un algorithme ne choisit pas seul son objectif. La plateforme lui indique un résultat à maximiser : durée de visite, interactions, diversité, satisfaction...",stem:"L’algorithme vise",
 o:[["Le temps passé","Prolonger les sessions, faire regarder davantage.","Vous augmentez les occasions de montrer des contenus ou des publicités, mais vous risquez d’encourager une utilisation excessive.",[1,2,0,-2]],
 ["Le nombre d’interactions","Favoriser ce qui génère likes, commentaires, partages et clics.","Votre plateforme paraît très active, mais les contenus qui provoquent de fortes émotions risquent d’être surreprésentés.",[2,1,0,-2]],
 ["La diversité des découvertes","Montrer des sujets, opinions et créateur·rices différents.","Vous ouvrez les horizons, mais certains contenus correspondront moins aux habitudes.",[-1,0,0,2]],
 ["La satisfaction et le bien-être","Prendre en compte les retours après une session.","Vous cherchez à améliorer la qualité de l’expérience, mais le bien-être est difficile à définir et à mesurer de manière fiable.",[-1,-1,0,2]]],
 sv:"Changer l’objectif d’un algorithme peut transformer l’ensemble de la plateforme. Un système qui optimise les clics ne sélectionne pas forcément les mêmes contenus qu’un système qui optimise la durée de visionnage, la diversité ou la satisfaction."},
F4:{q:"Peut-on comprendre et modifier l’algorithme ?",ctx:"La transparence permet de comprendre pourquoi certains contenus apparaissent. Le contrôle permet de modifier les critères, de réinitialiser ses préférences ou de choisir un autre type de fil.",stem:"Pour comprendre ou régler le système",
 o:[["Fonctionnement opaque","Presque aucune explication sur les règles de classement.","Vos règles sont difficiles à contourner, mais les décisions de l’algorithme sont presque impossibles à comprendre ou à contester.",[0,1,-1,-1]],
 ["Explications générales","Les grands critères sont expliqués, les détails restent confidentiels.","Vous améliorez la compréhension, mais les utilisateur·rices disposent encore de peu de contrôle réel.",[0,0,1,0]],
 ["Fonctionnement ouvert","Les règles sont publiées et vérifiables par des personnes indépendantes.","Vous facilitez l’audit et renforcez la confiance, mais certaines personnes peuvent chercher à manipuler les règles pour obtenir plus de visibilité.",[0,-1,1,1]],
 ["Réglages par l’utilisateur·rice","Chacun·e choisit entre plusieurs fils et règle certains critères.","Vous donnez davantage de liberté, mais les réglages peuvent sembler compliqués et beaucoup garderont les paramètres par défaut.",[0,-1,1,2]]],
 sv:"En Europe, TikTok et Instagram ont dû introduire un fil chronologique en option, sans recommandations algorithmiques. Ces alternatives existent, mais restent peu visibles face au fil personnalisé proposé par défaut."},
G1:{q:"Comment créez-vous un sentiment d’urgence pour revenir ?",ctx:"La peur de rater quelque chose (FOMO, Fear of Missing Out) est l’un des leviers les plus puissants pour générer des visites répétées.",stem:"Pour donner envie de revenir",
 o:[["Contenus éphémères","Stories, posts qui disparaissent après 24h.","Les contenus éphémères créent une pression à la consultation régulière : « si je ne regarde pas maintenant, je rate ».",[1,1,0,-1]],
 ["Notifications d’alerte","« Untel vient de poster, de réagir, vous a mentionné ».","Les notifications créent des interruptions dans la vie quotidienne.",[1,1,0,-2]],
 ["Direct et temps réel","Lives, streams, actualité instantanée.","Les lives créent un sentiment de présence partagée, et l’envie d’être là au bon moment.",[2,1,0,-1]],
 ["Aucun mécanisme d’urgence","Pas de contenu éphémère, pas d’alertes.","L’absence d’urgence rend la plateforme plus sereine, mais moins addictive au sens commercial.",[-2,-1,0,2]]],
 sv:"Une étude britannique du BSI (2025) révèle que 47 % des jeunes de 16 à 21 ans préféreraient vivre dans un monde sans Internet, et pourtant s’en détacher reste très difficile. Ce paradoxe s’explique en partie par le FOMO : la peur d’exclusion sociale si on n’est pas connecté."},
G2:{q:"Que voit une personne lorsqu’elle revient ?",ctx:"Le premier écran influence la suite de la visite. Il peut proposer immédiatement des contenus attractifs ou laisser choisir.",stem:"À l’ouverture, on voit",
 o:[["Un fil entièrement personnalisé","Les contenus que l’algorithme pense les plus intéressants.","La plateforme devient immédiatement attractive, mais elle renforce les habitudes créées par l’algorithme.",[1,2,-1,-1]],
 ["Un résumé de l’activité récente","Nouvelles publications, réactions et infos importantes.","On comprend vite ce qui s’est passé, mais l’idée de « tout ce qui a été manqué » peut créer une pression.",[1,0,0,-1]],
 ["Reprise à la dernière position","Retour exactement là où on s’était arrêté·e.","La navigation reste continue et pratique, mais elle encourage à reprendre une session qui n’était peut-être pas vraiment terminée.",[1,1,0,-1]],
 ["Un écran d’accueil neutre","On choisit : recherche, abonnements, catégories, types de fils.","Les utilisateur·rices gardent davantage de contrôle, mais doivent faire un choix actif avant de consulter un contenu.",[-1,-1,0,2]]],
 sv:"Les premières secondes passées dans une application sont particulièrement importantes. Un contenu très attirant placé dès l’ouverture peut donner envie de poursuivre la consultation avant même que la personne ait décidé ce qu’elle venait chercher."},
G3:{q:"Comment réagissez-vous quand une personne veut quitter l’application ?",ctx:"Il est facile de commencer à regarder des contenus, plus difficile de s’arrêter. Une plateforme peut faciliter le départ, rester neutre ou essayer de retenir.",stem:"Quand on veut partir",
 o:[["Sortie facilitée","Temps passé affiché, bouton visible pour faire une pause.","Vous réduisez probablement le temps passé à court terme, mais vous construisez une relation fondée sur la confiance et le contrôle.",[-1,-1,0,2]],
 ["Sortie neutre","Aucun message à la fermeture.","Vous n’aidez pas particulièrement à s’arrêter, mais vous ne cherchez pas non plus à retenir.",[0,0,0,0]],
 ["Une dernière recommandation","Un contenu de plus proposé avant le départ.","Vous pouvez prolonger certaines sessions, mais vous transformez le moment du départ en nouvelle occasion de captation.",[1,1,0,-1]],
 ["Sortie rendue difficile","Messages, fenêtres ou alertes insistent pour rester.","Vous augmentez peut-être la rétention à court terme, mais les utilisateur·rices peuvent se sentir piégé·es et finir par désinstaller l’application.",[-1,1,0,-2]]],
 sv:"Les interfaces conçues pour influencer ou compliquer une décision sont souvent appelées interfaces trompeuses ou dark patterns. Elles peuvent prendre la forme d’un bouton difficile à trouver, d’un message culpabilisant ou d’une étape supplémentaire pour refuser ou quitter."},
G4:{q:"Que faites-vous après sept jours d’absence ?",ctx:"Une plateforme peut respecter cette absence ou essayer de faire revenir la personne. La stratégie révèle votre rapport à la liberté de déconnexion.",stem:"Après 7 jours d’absence",
 o:[["Aucun message","La personne reviendra si elle en a envie.","Vous respectez totalement l’autonomie, mais certains comptes ne reviendront jamais.",[-1,-1,0,2]],
 ["Un résumé utile et facultatif","Quelques infos récentes, envois faciles à désactiver.","Vous fournissez une information réelle sans imposer le retour, mais le message rappelle quand même l’existence de la plateforme.",[1,0,0,0]],
 ["Un message d’urgence","Insister sur ce que la personne risque de manquer.","Cette stratégie peut faire revenir rapidement certaines personnes, mais elle utilise la peur de manquer quelque chose.",[1,1,0,-1]],
 ["Un message culpabilisant","Série interrompue, ami·es déçu·es, progression perdue.","Cette méthode peut être très efficace, mais elle risque de provoquer du stress, de la honte ou un rejet de la plateforme.",[0,1,0,-2]]],
 sv:"Les séries quotidiennes et les rappels sont souvent utilisés pour créer des habitudes. Duolingo en est l’exemple le plus connu : quand on rate une session, le hibou de l’application envoie des notifications de plus en plus insistantes. Le message semble amusant, mais la pression est réelle : rater sa série donne l’impression de perdre quelque chose."},
H1:{q:"Quels contenus votre plateforme valorise-t-elle ?",ctx:"Les contenus les plus visibles deviennent des modèles. Mettre certains contenus en avant encourage les membres à en produire davantage.",stem:"Nous valorisons",
 o:[["Les plus populaires","Ce qui obtient vite beaucoup de vues, réactions ou partages.","Vous augmentez la viralité et l’activité, mais vous risquez de favoriser les contenus sensationnels ou polarisants.",[2,1,0,-2]],
 ["Ceux jugés de qualité","Vérifiés, documentés, créatifs ou approfondis.","Vous pouvez améliorer la fiabilité et la richesse de la plateforme, mais la qualité reste difficile à définir et demande souvent une évaluation humaine.",[-1,0,0,2]],
 ["Ceux des comptes vérifiés","Identité ou expertise confirmée = plus de visibilité.","Vous réduisez certains risques de faux comptes, mais les nouveaux créateur·rices et les personnes moins connues peuvent être désavantagé·es.",[-1,0,-1,1]],
 ["Les contenus variés et moins visibles","Sujets de niche, créateur·rices peu connu·es.","Vous évitez que quelques publications concentrent toute l’attention, mais les contenus proposés peuvent générer moins de réactions immédiates.",[-1,0,0,1]]],
 sv:"Les contenus qui provoquent des émotions fortes obtiennent souvent davantage de réactions. Un algorithme fondé uniquement sur la popularité peut donc rendre très visibles des publications choquantes, conflictuelles ou trompeuses."},
H2:{q:"Comment traitez-vous les contenus problématiques ?",ctx:"La modération applique les règles de la plateforme : violence, menaces, harcèlement, contenus illégaux, images choquantes, comportements trompeurs.",stem:"Notre modération repose sur",
 o:[["Modération automatique","Des systèmes repèrent et bloquent certains contenus.","Le traitement est rapide et fonctionne à grande échelle, mais les outils peuvent mal comprendre l’humour, le contexte ou certaines différences culturelles.",[1,1,0,-1]],
 ["Modération mixte","Des outils détectent, une équipe humaine examine les cas importants.","Vous combinez rapidité et jugement humain, mais cette solution demande beaucoup de moyens et peut exposer les modérateur·rices à des contenus difficiles.",[0,-2,0,2]],
 ["Modération communautaire","Les membres signalent et participent à certaines décisions.","Les membres participent aux règles de leur espace, mais des groupes organisés peuvent utiliser les signalements pour faire taire certaines personnes.",[1,0,0,0]],
 ["Modération minimale","On intervient uniquement quand la loi l’exige clairement.","Vous réduisez les coûts et laissez davantage de liberté, mais des contenus nuisibles peuvent rester visibles même s’ils ne sont pas clairement illégaux.",[1,1,0,-2]]],
 sv:"La modération n’est pas seulement un problème technique. Elle demande aussi de comprendre les langues, les contextes culturels, l’humour, les relations entre les personnes et les nouvelles formes de harcèlement, d’où la nécessité d’une modération humaine et éthique."},
H3:{q:"Comment réagissez-vous face aux fausses informations ?",ctx:"Une info fausse circule vite quand elle est surprenante, inquiétante ou très émotionnelle. Vérifier, ralentir, sanctionner ou laisser circuler ?",stem:"Face à la désinformation",
 o:[["Vérification et avertissement","Des partenaires vérifient et ajoutent un avertissement.","Vous apportez du contexte et réduisez certains risques, mais la vérification est coûteuse et peut provoquer des accusations de censure ou de partialité.",[0,-1,0,2]],
 ["Réduction de la visibilité","Les contenus trompeurs restent accessibles, mais moins recommandés.","Vous limitez la diffusion sans supprimer, mais cette intervention est peu visible et difficile à contester.",[0,0,0,1]],
 ["Responsabilisation des comptes","Avertissements, fonctions retirées ou suspension pour les récidivistes.","Vous découragez les récidives, mais vous devez mettre en place une procédure équitable et permettre les recours.",[-1,0,0,1]],
 ["Absence d’intervention","Chacun·e décide si une info est fiable.","Vous évitez de décider vous-même ce qui est vrai, mais les informations dangereuses ou trompeuses peuvent atteindre un très large public.",[1,1,0,-2]]],
 sv:"Un avertissement ne suffit pas toujours à corriger une fausse information. Lorsqu’un contenu a déjà été vu et partagé de nombreuses fois, son effet peut continuer même après la publication d’une correction."},
H4:{q:"Quelle politique face à la haine et au harcèlement ?",ctx:"Insultes, menaces, humiliations, rumeurs, exclusion, campagnes coordonnées : les règles choisies déterminent si les personnes exposées peuvent se sentir protégées.",stem:"Contre le harcèlement",
 o:[["Politique stricte et rapide","Signalement simple, examen rapide, exclusion définitive possible.","Vous protégez rapidement les personnes visées, mais vous devez éviter les erreurs et proposer une possibilité de recours.",[-1,-1,0,2]],
 ["Politique progressive","Avertissement, limitation, suspension, puis exclusion.","Vous laissez une chance de changer de comportement, mais la réponse peut être trop lente dans les situations graves.",[0,0,0,1]],
 ["Contenus illégaux seulement","On supprime uniquement ce qui enfreint clairement la loi.","Les règles sont simples à expliquer, mais de nombreux comportements blessants ou intimidants peuvent rester visibles.",[1,1,0,-2]],
 ["Contre-discours et accompagnement","Plus de visibilité aux ressources, messages positifs et outils de soutien.","Vous favorisez l’éducation et le soutien, mais cette approche ne suffit pas toujours face à des menaces ou à des campagnes organisées.",[0,-1,0,1]]],
 sv:"Les outils de signalement sont plus efficaces lorsqu’ils sont faciles à trouver, compréhensibles et suivis d’une réponse claire. Une personne qui signale un contenu doit pouvoir savoir si sa demande a été examinée et quelle décision a été prise."}
};
const ALL=Object.keys(CARDS);
const MODES={

 complet:{label:"Intégrale",dur:"Séance complète",cards:ALL,k:3}
};

function tensions(upto){
 const c=S.choices, d=new Set(deck());
 return T.filter(t=>t.c.every(id=>d.has(id)&&c[id]!==undefined&&phaseOf(id)<=upto)&&t.w(c))
  .map(t=>({...t,text:t.q(c),phase:Math.max(...t.c.map(phaseOf))}));
}
function fallback(p){
 const f=FALLBACK[p].find(([id])=>deck().includes(id)&&S.choices[id]!==undefined);
 return f?{id:f[0],text:f[1]()}:null;
}

/* ---------- Jauges ---------- */
function gauges(over){
 const k=MODES[S.mode].k, g={aud:50,rev:50,priv:50,bien:50};
 for(const id of deck()){let c=S.choices[id]; if(over&&over.id===id) c=over.c; for(const ci of toArr(c)){ const e=CARDS[id].o[ci][3];
  g.aud+=e[0]*k; g.rev+=e[1]*k; g.priv+=e[2]*k; g.bien+=e[3]*k;}}
 for(const x in g) g[x]=Math.max(0,Math.min(100,Math.round(g[x])));
 return g;
}
function verdict(g){
 if(g.rev>=60&&g.bien<=40) return ["Une machine à attention","Votre plateforme rapporte, mais elle vit du temps et de l’attention de ses membres, parfois à leurs dépens."];
 if(g.priv<=35) return ["Une plateforme gourmande en données","Elle connaît très bien ses membres. Utile pour la pub et la personnalisation, beaucoup moins pour leur vie privée."];
 if(g.bien>=60&&g.rev<=40) return ["Un projet engagé mais fragile","Vos choix protègent les personnes. Comment financer et faire grandir ce projet sans le trahir ?"];
 if(g.bien>=55&&g.priv>=55&&g.rev>=45) return ["Un réseau équilibré","Vous avez cherché un compromis entre protection des personnes et viabilité. Quels choix vous ont coûté le plus ?"];
 if(g.aud>=65) return ["Une fusée à croissance","Votre réseau attire beaucoup de monde. À quel prix pour les membres et leurs données ?"];
 return ["Une plateforme hybride","Vos choix tirent dans plusieurs directions. Le journal montre où vos priorités ont changé."];
}
function gaugeQuestion(){
 const g=gauges(); const arr=GAUGES.map(x=>({...x,v:g[x.k]})).sort((a,b)=>b.v-a.v);
 const hi=arr[0], lo=arr[3];
 if(hi.v-lo.v<15) return `Vos jauges finales sont proches (de ${lo.v} à ${hi.v}). Compromis réussi, ou choix évités ?`;
 return `Jauge la plus haute : ${hi.l} (${hi.v}). La plus basse : ${lo.l} (${lo.v}). C’est la plateforme que vous vouliez ? Qui en paie le prix ?`;
}

function confetti(){
 if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches) return;
 const cv=document.createElement("canvas"); cv.id="confetti"; document.body.appendChild(cv);
 const dpr=Math.min(2,window.devicePixelRatio||1), W=innerWidth, H=innerHeight; cv.width=W*dpr; cv.height=H*dpr;
 const c=cv.getContext("2d"); c.scale(dpr,dpr);
 const cols=[PH[1],PH[2],PH[3],PH[4],"#FCC83A","#C94068"];
 const parts=[];
 for(let b=0;b<2;b++) for(let i=0;i<90;i++){
  const fromLeft=b===0;
  parts.push({x:fromLeft?-10:W+10,y:H*.75,vx:(fromLeft?1:-1)*(6+Math.random()*9),vy:-(10+Math.random()*12),s:6+Math.random()*7,r:Math.random()*6,vr:(Math.random()-.5)*.4,col:cols[i%cols.length],shape:i%3});
 }
 const t0=performance.now();
 (function frame(t){
  const el=t-t0; c.clearRect(0,0,W,H);
  for(const p of parts){p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
   c.save();c.translate(p.x,p.y);c.rotate(p.r);c.fillStyle=p.col;c.globalAlpha=Math.max(0,1-el/3200);
   if(p.shape===0)c.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);else if(p.shape===1){c.beginPath();c.arc(0,0,p.s/2.4,0,7);c.fill();}else{c.beginPath();c.moveTo(0,-p.s/2);c.lineTo(p.s/2,p.s/2);c.lineTo(-p.s/2,p.s/2);c.closePath();c.fill();}
   c.restore();}
  if(el<3300) requestAnimationFrame(frame); else cv.remove();
 })(t0);
}

 c.fillStyle="#5D6079"; c.font='400 28px "Parkinsans", sans-serif'; let y=wrap(c,S.baseline||"",M,214,W-2*M-200,36);

 // Carte d'identité
 c.fillStyle="#1B1D3A"; c.font='700 28px "Parkinsans", sans-serif'; c.fillText("Carte d’identité",M,y); y+=20;

 y+=24;
 // Jauges
 c.fillStyle="#1B1D3A"; c.font='700 28px "Parkinsans", sans-serif'; c.fillText("Jauges finales",M,y); y+=24;
 const g=gauges(); const colW=(W-2*M-40)/2;

  c.fillStyle="#1B1D3A"; c.font='600 22px "Parkinsans", sans-serif'; c.textAlign="left"; c.fillText(x.l,gx,gy+26);
  c.fillStyle="#EFEADB"; rr(gx+150,gy+10,colW-220,20,10,c); c.fill(); c.fillStyle="#1B1D3A"; if(g[x.k]>0){rr(gx+150,gy+10,Math.max(20,(colW-220)*g[x.k]/100),20,10,c); c.fill();}
  c.textAlign="right"; c.font='700 24px "Parkinsans", sans-serif'; c.fillText(String(g[x.k]),gx+colW,gy+28); c.textAlign="left";});
 y+=130;
 // Décisions
 c.fillStyle="#1B1D3A"; c.font='700 28px "Parkinsans", sans-serif'; c.fillText("Décisions",M,y); y+=16;
 const ids=deck().filter(id=>S.choices[id]!==undefined); const cols=ids.length>12?2:1; const per=Math.ceil(ids.length/cols); const cw=(W-2*M-(cols-1)*30)/cols;
 const rowH=Math.min(40,(H-175-y)/Math.max(1,per));
 ids.forEach((id,i)=>{const col=Math.floor(i/per), r=i%per, x=M+col*(cw+30), yy=y+r*rowH+8;
  c.fillStyle=PH[phaseOf(id)]; rr(x,yy,52,rowH-8,8,c); c.fill(); c.fillStyle="#fff"; c.font=`700 ${Math.min(18,rowH*.5)}px "Parkinsans", sans-serif`; c.textAlign="center"; c.fillText(id,x+26,yy+(rowH-8)/2+6);

  let t=label(id); while(c.measureText(t).width>cw-70&&t.length>4) t=t.slice(0,-2); if(t!==label(id)) t=t.trim()+"…"; c.fillText(t,x+66,yy+(rowH-8)/2+6);});
 yapMark(c,M,H-112,170);
 {const bw=380,bh=bw*euImg.naturalHeight/euImg.naturalWidth+36,bx=W-M-bw-36,by=H-34-bh; c.fillStyle="#1B1D3A"; rr(bx,by,bw+36,bh,16,c); c.fill(); if(euImg.naturalWidth) c.drawImage(euImg,bx+18,by+18,bw,bw*euImg.naturalHeight/euImg.naturalWidth);}

async function doDownload(kind){
 const d=await downloadsNS();
 if(!d){
  if(!window.claude){try{const blob=kind==="poster"?await posterBlob():await portraitBlob();const u=URL.createObjectURL(blob);const a=document.createElement("a");a.href=u;a.download=`${slug(S.name)}-${kind==="poster"?"affiche":"portrait"}.png`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast("Image enregistrée");return;}catch(e){}}
  toast("Téléchargement indisponible ici : faites une capture d’écran.");return;}
 try{
  const blob=kind==="poster"?await posterBlob():await portraitBlob();
  await d.save({filename:`${slug(S.name)}-${kind==="poster"?"affiche":"portrait"}.png`,data:blob});
  toast("Image enregistrée");
 }catch(e){
  const code=e&&e.code;
  if(code==="declined") return;
  if(code==="rate_limited"){toast("Une demande est déjà ouverte. Réessayez dans un instant.");return;}
  toast("Téléchargement indisponible ici : faites une capture d’écran.");
 }
}

/* ---------- Journal & modales ---------- */
function journalHTML(){
 let h="";
 for(const p of [1,2,3,4]){ const ids=deck().filter(id=>phaseOf(id)===p&&S.choices[id]!==undefined); if(!ids.length) continue;
  h+=`<div class="jphase" style="--pc:${PH[p]}">Phase ${p} · ${PHASES[p].name}</div>`;
  h+=ids.map(id=>{const c=CARDS[id], changes=S.hist.filter(x=>x.id===id&&x.from!=null);
   return `<details class="ji" style="--pc:${PH[p]}"><summary><span class="code">${id}</span><span class="lab">${esc(label(id))}<small>${c.q}</small></span>${I("chev")}</summary>
   <div class="more">${versoHTML(id,S.choices[id])}
   ${changes.map(x=>`<div class="was">${I("undo")} Avant : <s>${esc(optNames(id,x.from))}</s></div>`).join("")}
   <div><button class="btn revise" data-act="revise" data-id="${id}">${I("undo")} Revenir sur ce choix</button></div></div></details>`;}).join("");
 }
 return h||`<p class="calm">Aucun choix pour l’instant.</p>`;
}
function openJournal(){
 layer.innerHTML=`<div class="drawer" data-act="close-layer"><div class="drawer-in" role="dialog" aria-label="Journal des décisions">
  <div class="drawer-top"><h2>${I("book")} Journal</h2><button class="ibtn" data-act="close-layer" aria-label="Fermer">${I("x")}</button></div>
  ${journalHTML()}</div></div>`;
}
function openName(){
 layer.innerHTML=`<div class="modal"><div class="modal-in" role="dialog" aria-label="Nom de la plateforme">
  <div class="field"><label for="f-rename">${I("pencil")} Nom de la plateforme</label><input id="f-rename" class="big" maxlength="40" value="${esc(S.name)}"></div>
  <div class="row" style="justify-content:flex-end"><button class="btn ghost" data-act="close-layer" aria-label="Annuler">${I("x")}</button><button class="btn" data-act="save-name">${I("check")} OK</button></div></div></div>`;
 const i=document.getElementById("f-rename"); i.focus(); i.select();
 i.addEventListener("keydown",e=>{if(e.key==="Enter")act("save-name");});
}
function openConfirmNew(){
 layer.innerHTML=`<div class="modal"><div class="modal-in" role="dialog" aria-label="Nouvelle partie">
  <h3>Recommencer ?</h3><p class="calm">La partie en cours sera effacée.</p>
  <div class="row" style="justify-content:flex-end"><button class="btn ghost" data-act="close-layer">${I("x")} Non</button><button class="btn" data-act="confirm-new">${I("restart")} Oui</button></div></div></div>`;
}

/* ---------- Navigation ---------- */
function render(){
 ({setup:renderSetup,card:renderCard,bilan:renderBilan,recap:renderRecap,baseline:renderBaseline,logo:renderLogo,final:renderFinal})[S.screen]();
 save();
}
function scrollTop(){try{window.scrollTo({top:0,behavior:"smooth"});}catch(e){window.scrollTo(0,0);}}
function startRevise(id){
 layer.innerHTML="";
 if(S.revise){S.revise.id=id;}
 else S.revise={id,back:S.screen,pendingBack:S.screen==="card"?S.pending:null};
 S.pending=MULTI[id]?toArr(S.choices[id]).slice():S.choices[id]; S.screen="card"; render(); scrollTop();
}
function endRevise(){
 const r=S.revise; S.revise=null; S.screen=r.back; S.pending=r.back==="card"?r.pendingBack:null; render(); scrollTop();
}
function act(a,el){
 const d=el?el.dataset:{};
 switch(a){
  case"mode":S.mode=d.v;S.name=document.getElementById("f-name").value;S.team=document.getElementById("f-team").value;render();break;
  case"start":S.name=document.getElementById("f-name").value.trim();S.team=document.getElementById("f-team").value.trim();S.screen="card";S.idx=0;S.choices={};S.hist=[];S.acked=[];S.pending=null;S.revise=null;render();scrollTop();break;
  case"resume":S=Object.assign(fresh(),saved);saved=null;render();break;
  case"pick":{const id=curId(), i=+d.i, m=MULTI[id];
   if(!m){S.pending=i;}
   else{let a=toArr(S.pending).slice();
    if(a.includes(i)) a=a.filter(x=>x!==i);
    else if(i===m.excl) a=[i];
    else a=a.filter(x=>x!==m.excl).concat(i);
    S.pending=a.sort((x,y)=>x-y);}
   render();break;}
  case"validate":{
   if(S.pending==null||(Array.isArray(S.pending)&&!S.pending.length)) break;
   if(S.revise){const id=S.revise.id, from=S.choices[id];
    if(!same(S.pending,from)){S.choices[id]=S.pending;S.hist.push({id,from,to:S.pending});S.acked=S.acked.filter(t=>{const x=T.find(y=>y.id===t);return x&&!x.c.includes(id);});}
    endRevise();break;}
   const dk=deck(), id=dk[S.idx]; S.choices[id]=S.pending; S.hist.push({id,from:null,to:S.pending}); S.pending=null; S.idx++;
   if(S.idx>=dk.length||phaseOf(dk[S.idx])!==phaseOf(id)){S.bilan=phaseOf(id);S.screen="bilan";}
   render();scrollTop();break;}
  case"sv":S.svOpen=!S.svOpen;render();break;
  case"bilan-next":S.screen=S.idx>=deck().length?"recap":"card";render();scrollTop();break;
  case"revise":startRevise(d.id);break;
  case"cancel-revise":endRevise();break;
  case"ack":if(!S.acked.includes(d.t))S.acked.push(d.t);render();break;
  case"journal":openJournal();break;
  case"close-layer":layer.innerHTML="";break;
  case"edit-name":openName();break;
  case"save-name":S.name=document.getElementById("f-rename").value.trim();layer.innerHTML="";render();break;
  case"go":if(d.v==="final"&&S.screen==="logo")party=true;S.screen=d.v;render();scrollTop();break;
  case"sugg":S.baseline=d.v;render();break;
  case"bl-more":S.blOff=(S.blOff||0)+8;render();break;
  case"ltab":S.logoTab=d.v;render();break;
  case"lset":S.logo[d.k]=d.v;render();break;
  case"brush":S.brush=d.v;S.eraser=false;render();break;
  case"eraser":S.eraser=!S.eraser;render();break;
  case"clear-draw":S.drawing="";render();break;
  case"dl-portrait":doDownload("portrait");break;
  case"new":openConfirmNew();break;
  case"confirm-new":layer.innerHTML="";S=fresh();saved=null;try{localStorage.removeItem(KEY);}catch(e){}render();scrollTop();break;
 }
}
document.addEventListener("click",e=>{
 const t=e.target.closest("[data-act]"); if(!t) return;
 if(t.dataset.act==="close-layer"&&t.classList.contains("drawer")&&e.target!==t) return;
 act(t.dataset.act,t);
});

 if(e.target.id==="f-bsize"){S.bsize=+e.target.value;save();}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&layer.innerHTML)layer.innerHTML="";});

if(saved&&saved.screen&&saved.screen!=="setup"){S.mode=saved.mode||"moyen";}
render();
})();
